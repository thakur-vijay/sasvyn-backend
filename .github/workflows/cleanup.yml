name: Idempotency Cleanup

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  cleanup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Run cleanup
        run: go run ./cmd/cleanup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}